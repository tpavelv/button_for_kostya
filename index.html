<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <title>КНОПКА</title>
  </head>
  <body>
    <div
      class="wrap"
      style="
        width: 200px;
        height: 300px;
        border: 1px solid;
        margin: 30px auto;
        display: flex;
        justify-content: space-around;
        flex-direction: column;
        background-color: gainsboro;
      "
    >
      <h1 class="counter" style="text-align: center; font-size: 80px">0</h1>
      <button type="button" class="btn btn-primary" style="margin: 0 auto">
        Добавить денег
      </button>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      const wrap = document.querySelector(".wrap");
      const btn = document.querySelector(".btn");
      const title = document.querySelector(".counter");
      let counter = 0;
      title.textContent = 0;
      //   btn.addEventListener('touchstart')
      btn.addEventListener("touchstart", () => {
        counter++;
        if (counter === 1000) {
          title.style.fontSize = "50px";
          title.style.color = "orange";
          wrap.style.backgroundColor = "green";

          title.textContent = `YOU WIN!!!
          Люблю тебя`;
          console.log(title.textContent);
          btn.style.display = "none";
          return;
        }
        title.textContent = counter;
      });
    </script>
  </body>
</html>
